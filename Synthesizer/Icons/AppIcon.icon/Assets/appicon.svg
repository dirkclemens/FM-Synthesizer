<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
 <defs>
 <!-- Gradient for the synth body -->
 <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1"/>
 <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1"/>
 <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1"/>
 </linearGradient>
 
 <!-- Gradient for the sine wave -->
 <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1"/>
 <stop offset="50%" style="stop-color:#7b2cbf;stop-opacity:1"/>
 <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1"/>
 </linearGradient>
 
 <!-- Glow filter -->
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
 <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
 <feMerge>
 <feMergeNode in="coloredBlur"/>
 <feMergeNode in="SourceGraphic"/>
 </feMerge>
 </filter>
 
 <!-- Subtle inner shadow -->
 <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
 <feOffset dx="0" dy="4"/>
 <feGaussianBlur stdDeviation="4" result="offset-blur"/>
 <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
 <feFlood flood-color="#000000" flood-opacity="0.4" result="color"/>
 <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
 <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
 </filter>
 </defs>
 
 <!-- Background rounded square -->
 <rect x="40" y="40" width="944" height="944" rx="200" ry="200" fill="url(#bgGradient)" filter="url(#innerShadow)"/>
 
 <!-- Subtle border -->
 <rect x="40" y="40" width="944" height="944" rx="200" ry="200" fill="none" stroke="#333344" stroke-width="8"/>
 
 <!-- Center circle (synth knob aesthetic) -->
 <circle cx="512" cy="512" r="260" fill="none" stroke="#2a2a3a" stroke-width="4"/>
 <circle cx="512" cy="512" r="240" fill="none" stroke="#1a1a24" stroke-width="2"/>
 
 <!-- Six operator dots in a circle (FM synthesis operators) -->
 <g id="operatorDots">
 <circle cx="512" cy="280" r="22" fill="#00d4ff" filter="url(#glow)"/>
 <circle cx="724" cy="390" r="20" fill="#7b2cbf" filter="url(#glow)"/>
 <circle cx="744" cy="610" r="22" fill="#ff006e" filter="url(#glow)"/>
 <circle cx="512" cy="720" r="20" fill="#00d4ff" filter="url(#glow)"/>
 <circle cx="300" cy="610" r="22" fill="#7b2cbf" filter="url(#glow)"/>
 <circle cx="280" cy="390" r="20" fill="#ff006e" filter="url(#glow)"/>
 </g>
 
 <!-- Connecting lines between operators (FM routing hint) -->
 <g stroke="#2a2a4a" stroke-width="3" opacity="0.6">
 <line x1="512" y1="302" x2="706" y2="370"/>
 <line x1="706" y1="370" x2="726" y2="590"/>
 <line x1="726" y1="590" x2="512" y2="698"/>
 <line x1="512" y1="698" x2="318" y2="590"/>
 <line x1="318" y1="590" x2="294" y2="370"/>
 <line x1="294" y1="370" x2="512" y2="302"/>
 <!-- Center connections -->
 <line x1="512" y1="302" x2="512" y2="280"/>
 <line x1="706" y1="370" x2="724" y2="390"/>
 <line x1="726" y1="590" x2="744" y2="610"/>
 <line x1="512" y1="698" x2="512" y2="720"/>
 <line x1="318" y1="590" x2="300" y2="610"/>
 <line x1="294" y1="370" x2="280" y2="390"/>
 </g>
 
 <!-- Sine wave across the center -->
 <path d="M 180 512 
 Q 260 420 340 512 
 T 420 512 
 T 500 512 
 T 580 512 
 T 660 512 
 T 740 512 
 T 820 512 
 T 900 512 
 T 980 512" 
 fill="none" stroke="url(#waveGradient)" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>
 
 <!-- Small waveform detail circles -->
 <circle cx="340" cy="512" r="8" fill="#ffffff" opacity="0.8"/>
 <circle cx="500" cy="512" r="8" fill="#ffffff" opacity="0.6"/>
 <circle cx="660" cy="512" r="8" fill="#ffffff" opacity="0.8"/>
 
 <!-- Top accent bar -->
 <rect x="200" y="100" width="624" height="16" rx="8" fill="#00d4ff" opacity="0.3"/>
 <rect x="200" y="100" width="200" height="16" rx="8" fill="#00d4ff"/>
 
 <!-- Bottom accent -->
 <rect x="200" y="908" width="624" height="16" rx="8" fill="#ff006e" opacity="0.3"/>
 <rect x="624" y="908" width="200" height="16" rx="8" fill="#ff006e"/>
 
 <!-- Subtle texture dots -->
 <g fill="#ffffff" opacity="0.03">
 <circle cx="150" cy="150" r="2"/>
 <circle cx="874" cy="150" r="2"/>
 <circle cx="150" cy="874" r="2"/>
 <circle cx="874" cy="874" r="2"/>
 <circle cx="512" cy="150" r="1.5"/>
 <circle cx="512" cy="874" r="1.5"/>
 <circle cx="150" cy="512" r="1.5"/>
 <circle cx="874" cy="512" r="1.5"/>
 </g>
</svg>
